# Builds the Polar Client mod for every Minecraft version and the launcher installers on every push, to check that
# everything still builds. Download them from the run's "Artifacts" section. Releases come from release.yml.
name: build
on:
  push:
    branches: ['**'] # version tags run the release workflow instead
    paths-ignore: ['news.json', '**/*.md', 'docs/**', 'branding/**']
  pull_request:
  workflow_dispatch:

jobs:
  mod:
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.3', '1.21.11', '1.21.10', '1.16.5', '1.8.9']
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mod/${{ matrix.minecraft }}
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: polarclient-mod-${{ matrix.minecraft }}
          path: mod/${{ matrix.minecraft }}/build/libs/

  launcher:
    needs: mod
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: launcher
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned builds; add signing secrets for public releases
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: polarclient-mod-*
      - name: Put each version's jar back where bundle-mod looks for it
        shell: bash
        run: |
          for v in 26.3 1.21.11 1.21.10 1.16.5 1.8.9; do
            mkdir -p ../mod/$v/build/libs
            cp ../polarclient-mod-$v/*.jar ../mod/$v/build/libs/
          done
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run bundle-mod
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: polar-launcher-${{ matrix.os }}
          path: |
            launcher/dist/*.exe
            launcher/dist/*.dmg
            launcher/dist/*.AppImage
          if-no-files-found: ignore
